<body data-page="login" data-title-key="login.title" data-no-footer class="solid-header">
<main id="main" class="auth">
  <section class="auth-art dark">
    <div class="hero-gl" aria-hidden="true"><canvas data-gl-orb></canvas></div>
    <span class="eyebrow fade-up" data-i18n="portal.teaser.eyebrow"></span>
    <h1 class="h-l" data-split data-split-manual style="margin-top:20px" data-i18n-html="portal.teaser.title"></h1>
  </section>
  <section class="auth-form">
    <form class="form-card" data-login novalidate>
      <div style="display:grid;gap:12px">
        <h2 class="h-l" data-split data-i18n="login.title"></h2>
        <p class="muted" data-i18n="login.lead"></p>
      </div>
      <div class="field"><label for="code" data-i18n="login.code"></label><input class="input" id="code" autocomplete="username" autocapitalize="characters" data-i18n-attr="placeholder:login.code.ph" required></div>
      <div class="field"><label for="password" data-i18n="login.password"></label>
        <div class="pw-wrap"><input class="input" id="password" type="password" autocomplete="current-password" required>
          <button class="pw-toggle" type="button" aria-pressed="false" data-i18n-attr="aria-label:login.show"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <p class="alert alert--err" data-login-error hidden role="alert" data-i18n="login.error"></p>
      <button class="btn btn--block" type="submit"><svg class="ok-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span data-i18n="login.submit"></span><svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <p class="form-note" data-i18n="login.forgot"></p>
      <span class="secure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span data-i18n="login.secure"></span></span>
      <div class="demo-box">
        <b data-i18n="login.demo.t"></b>
        <span class="muted" data-i18n="login.demo.d"></span>
        <div class="codes"><button type="button" data-demo-code="PH-1001">PH-1001</button><button type="button" data-demo-code="EN-2001">EN-2001</button><button type="button" data-demo-code="CH-3001">CH-3001</button></div>
      </div>
      <p class="form-note"><span data-i18n="login.notmember"></span> <a class="link-arrow" style="font-size:14px" href="join.html" data-i18n="nav.join"></a></p>
    </form>
  </section>
</main>
<script src="assets/vendor/gsap.min.js" defer></script>

<script src="assets/js/portal.js?v=8" defer></script>
</body>
</html>
