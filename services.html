<!doctype html>
<html lang="hu" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Védőkör Szakszervezet</title>
  <meta name="description" content="Munkavállalói érdekképviselet több vállalatnál — jogsegély, bértárgyalás, támogatás.">
  <meta name="theme-color" content="#0b0a1a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="services" data-title-key="nav.services" class="page-light">
<main id="main">
  <section class="page-hero">
    <div class="blob" aria-hidden="true"></div>
    <div class="container">
      <span class="eyebrow fade-up" data-i18n="svc.eyebrow"></span>
      <h1 class="h-xl fade-up d2" style="margin-top:24px" data-i18n-html="services.page.title"></h1>
      <p class="lead muted fade-up d3" data-i18n="services.page.lead"></p>
    </div>
  </section>

  <section class="section paper" style="padding-top:0">
    <div class="container">
      <div class="svc-list">
        <div class="svc reveal"><h3 data-i18n="svc.1.t"></h3><p data-i18n="svc.1.d"></p><span class="svc-arrow">↗</span></div>
        <div class="svc reveal"><h3 data-i18n="svc.2.t"></h3><p data-i18n="svc.2.d"></p><span class="svc-arrow">↗</span></div>
        <div class="svc reveal"><h3 data-i18n="svc.3.t"></h3><p data-i18n="svc.3.d"></p><span class="svc-arrow">↗</span></div>
        <div class="svc reveal"><h3 data-i18n="svc.4.t"></h3><p data-i18n="svc.4.d"></p><span class="svc-arrow">↗</span></div>
        <div class="svc reveal"><h3 data-i18n="svc.5.t"></h3><p data-i18n="svc.5.d"></p><span class="svc-arrow">↗</span></div>
        <div class="svc reveal"><h3 data-i18n="svc.6.t"></h3><p data-i18n="svc.6.d"></p><span class="svc-arrow">↗</span></div>
      </div>
    </div>
  </section>

  <section class="section dark">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow" data-i18n="services.benefits.t"></span>
        <h2 class="h-l" data-i18n-html="why.title"></h2>
      </div>
      <div class="benefit-grid">
        <div class="benefit reveal" data-i18n="services.b1"></div>
        <div class="benefit reveal" style="--d:.05s" data-i18n="services.b2"></div>
        <div class="benefit reveal" style="--d:.1s" data-i18n="services.b3"></div>
        <div class="benefit reveal" data-i18n="services.b4"></div>
        <div class="benefit reveal" style="--d:.05s" data-i18n="services.b5"></div>
        <div class="benefit reveal" style="--d:.1s" data-i18n="services.b6"></div>
      </div>
    </div>
  </section>

  <section class="section--tight">
    <div class="container">
      <div class="helpline reveal">
        <div style="display:grid;gap:12px">
          <h2 class="h-m" data-i18n="services.help.t"></h2>
          <p data-i18n="services.help.d"></p>
        </div>
        <a class="phone-num" href="tel:+3610000001">+36 1 000 0001</a>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:40px">
    <div class="container faq-wrap">
      <div class="reveal" style="display:grid;gap:20px;align-content:start">
        <span class="eyebrow" data-i18n="faq.eyebrow"></span>
        <h2 class="h-l" data-i18n="faq.title"></h2>
      </div>
      <div class="faq reveal">
        <details open><summary><span data-i18n="faq.1.q"></span><span class="plus"></span></summary><p class="answer" data-i18n="faq.1.a"></p></details>
        <details><summary><span data-i18n="faq.2.q"></span><span class="plus"></span></summary><p class="answer" data-i18n="faq.2.a"></p></details>
        <details><summary><span data-i18n="faq.5.q"></span><span class="plus"></span></summary><p class="answer" data-i18n="faq.5.a"></p></details>
      </div>
    </div>
  </section>
</main>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
