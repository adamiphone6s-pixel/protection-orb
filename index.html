<!doctype html>
<html lang="hu" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Védőkör Szakszervezet</title>
  <meta name="description" content="Munkavállalói érdekképviselet több vállalatnál — jogsegély, bértárgyalás, támogatás.">
  <meta name="theme-color" content="#0b0a1a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">
  <meta property="og:title" content="Védőkör Szakszervezet — Együtt erősebbek vagyunk">
  <meta property="og:description" content="Munkavállalói érdekképviselet több vállalatnál.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="home">
<main id="main">

  <!-- HERO -->
  <section class="hero dark">
    <div class="hero-orb" aria-hidden="true"><canvas data-orb></canvas></div>
    <div class="container hero-grid">
      <span class="eyebrow fade-up" data-i18n="hero.eyebrow"></span>
      <h1 class="h-xl hero-title">
        <span class="line"><span data-i18n="hero.title.1"></span></span>
        <span class="line"><span data-i18n="hero.title.2"></span></span>
        <span class="line"><span data-i18n="hero.title.3"></span></span>
      </h1>
      <div class="hero-bottom">
        <div style="display:grid;gap:28px">
          <p class="lead fade-up d2" data-i18n="hero.lead"></p>
          <div class="hero-ctas fade-up d3">
            <a class="btn btn--volt" href="join.html"><span data-i18n="hero.cta.join"></span><svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
            <a class="btn btn--ghost" href="login.html" data-i18n="hero.cta.members"></a>
          </div>
        </div>
        <span class="scroll-hint fade-up d3"><i></i><span data-i18n="hero.scroll"></span></span>
      </div>
      <div class="stats fade-up d3">
        <div class="stat"><b data-count="12400"></b><span data-i18n="stats.members"></span></div>
        <div class="stat"><b data-count="38"></b><span data-i18n="stats.companies"></span></div>
        <div class="stat"><b data-count="35"></b><span data-i18n="stats.years"></span></div>
        <div class="stat"><b data-count="920" data-suffix="+"></b><span data-i18n="stats.cases"></span></div>
      </div>
    </div>
  </section>

  <!-- MARQUEE -->
  <div class="marquee-wrap"><div class="marquee" aria-hidden="true">
    <div class="marquee-track"><span data-i18n="marquee"></span><span data-i18n="marquee"></span><span data-i18n="marquee"></span><span data-i18n="marquee"></span></div>
  </div></div>

  <!-- WHY -->
  <section class="section">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow" data-i18n="why.eyebrow"></span>
        <h2 class="h-l" data-i18n-html="why.title"></h2>
        <p class="lead muted" data-i18n="why.lead"></p>
      </div>
      <div class="bento">
        <article class="card card--span-7 card--ink card--feature reveal">
          <span class="big-num">01</span>
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M5 21h14M4 8h16M7 8l-3 7a3 3 0 0 0 6 0L7 8Zm10 0-3 7a3 3 0 0 0 6 0l-3-7Z"/></svg></div>
          <h3 class="h-m" data-i18n="why.1.t"></h3>
          <p data-i18n="why.1.d"></p>
        </article>
        <article class="card card--span-5 card--volt reveal" style="--d:.08s">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></div>
          <h3 class="h-s" data-i18n="why.2.t"></h3>
          <p data-i18n="why.2.d"></p>
        </article>
        <article class="card card--span-4 reveal">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg></div>
          <h3 class="h-s" data-i18n="why.3.t"></h3>
          <p data-i18n="why.3.d"></p>
        </article>
        <article class="card card--span-4 reveal" style="--d:.08s">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></div>
          <h3 class="h-s" data-i18n="why.4.t"></h3>
          <p data-i18n="why.4.d"></p>
        </article>
        <article class="card card--span-4 card--violet reveal" style="--d:.16s">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.6L20 11l-5.8 2.4L12 19l-2.2-5.6L4 11l5.8-2.4L12 3Z"/></svg></div>
          <h3 class="h-s" data-i18n="why.5.t"></h3>
          <p data-i18n="why.5.d"></p>
        </article>
      </div>
    </div>
  </section>

  <!-- SERVICES -->
  <section class="section dark">
    <div class="container">
      <div class="section-head section-head--row reveal">
        <div style="display:grid;gap:20px">
          <span class="eyebrow" data-i18n="svc.eyebrow"></span>
          <h2 class="h-l" data-i18n="svc.title"></h2>
        </div>
        <a class="link-arrow" href="services.html"><span data-i18n="svc.more"></span> →</a>
      </div>
      <div class="svc-list">
        <a class="svc reveal" href="services.html"><h3 data-i18n="svc.1.t"></h3><p data-i18n="svc.1.d"></p><span class="svc-arrow">↗</span></a>
        <a class="svc reveal" href="services.html"><h3 data-i18n="svc.2.t"></h3><p data-i18n="svc.2.d"></p><span class="svc-arrow">↗</span></a>
        <a class="svc reveal" href="services.html"><h3 data-i18n="svc.3.t"></h3><p data-i18n="svc.3.d"></p><span class="svc-arrow">↗</span></a>
        <a class="svc reveal" href="services.html"><h3 data-i18n="svc.4.t"></h3><p data-i18n="svc.4.d"></p><span class="svc-arrow">↗</span></a>
        <a class="svc reveal" href="services.html"><h3 data-i18n="svc.5.t"></h3><p data-i18n="svc.5.d"></p><span class="svc-arrow">↗</span></a>
      </div>
    </div>
  </section>

  <!-- STEPS -->
  <section class="section">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow" data-i18n="steps.eyebrow"></span>
        <h2 class="h-l" data-i18n-html="steps.title"></h2>
      </div>
      <div class="steps">
        <div class="step reveal"><h3 class="h-s" data-i18n="steps.1.t"></h3><p data-i18n="steps.1.d"></p></div>
        <div class="step reveal" style="--d:.1s"><h3 class="h-s" data-i18n="steps.2.t"></h3><p data-i18n="steps.2.d"></p></div>
        <div class="step reveal" style="--d:.2s"><h3 class="h-s" data-i18n="steps.3.t"></h3><p data-i18n="steps.3.d"></p></div>
      </div>
    </div>
  </section>

  <!-- PORTAL TEASER -->
  <section class="section--tight">
    <div class="container">
      <div class="teaser reveal">
        <div>
          <span class="eyebrow" data-i18n="portal.teaser.eyebrow"></span>
          <h2 class="h-l" style="margin-top:20px" data-i18n-html="portal.teaser.title"></h2>
          <p class="lead muted" style="margin-top:20px" data-i18n="portal.teaser.lead"></p>
          <ul class="checklist">
            <li data-i18n="portal.teaser.l1"></li>
            <li data-i18n="portal.teaser.l2"></li>
            <li data-i18n="portal.teaser.l3"></li>
          </ul>
          <a class="btn btn--volt" href="login.html"><span data-i18n="portal.teaser.cta"></span><svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        </div>
        <div class="phone" aria-hidden="true">
          <div class="phone-screen">
            <div class="ps-top"><span style="font-weight:800">Minta Pharma</span><span class="ps-avatar"></span></div>
            <div class="ps-title">Szia, Anna 👋</div>
            <div class="ps-card volt"><div style="font-weight:700;opacity:.7">Béremelés 2026</div><div class="ps-big">+9,5%</div></div>
            <div class="ps-row">
              <div class="ps-card ink"><div style="opacity:.7">Bizalmik</div><div class="ps-big" style="font-size:22px">6</div></div>
              <div class="ps-card"><div style="opacity:.7">Dokumentum</div><div class="ps-big" style="font-size:22px">14</div></div>
            </div>
            <div class="ps-card"><div style="font-weight:700;margin-bottom:8px">Kollektív szerződés</div><div class="ps-bar" style="width:90%"></div><div class="ps-bar" style="width:70%;margin-top:6px"></div></div>
            <div class="ps-card"><div style="font-weight:700;margin-bottom:8px">Családi nap · okt. 12.</div><div class="ps-bar" style="width:60%"></div></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- NEWS -->
  <section class="section">
    <div class="container">
      <div class="section-head section-head--row reveal">
        <div style="display:grid;gap:20px">
          <span class="eyebrow" data-i18n="news.eyebrow"></span>
          <h2 class="h-l" data-i18n="news.title"></h2>
        </div>
        <a class="link-arrow" href="news.html"><span data-i18n="news.all"></span> →</a>
      </div>
      <div class="news-grid" data-news-latest></div>
    </div>
  </section>

  <!-- FAQ -->
  <section class="section" style="padding-top:0">
    <div class="container faq-wrap">
      <div class="reveal" style="display:grid;gap:20px;align-content:start">
        <span class="eyebrow" data-i18n="faq.eyebrow"></span>
        <h2 class="h-l" data-i18n="faq.title"></h2>
      </div>
      <div class="faq reveal">
        <details open><summary><span data-i18n="faq.1.q"></span><span class="plus"></span></summary><p class="answer" data-i18n="faq.1.a"></p></details>
        <details><summary><span data-i18n="faq.2.q"></span><span class="plus"></span></summary><p class="answer" data-i18n="faq.2.a"></p></details>
        <details><summary><span data-i18n="faq.3.q"></span><span class="plus"></span></summary><p class="answer" data-i18n="faq.3.a"></p></details>
        <details><summary><span data-i18n="faq.4.q"></span><span class="plus"></span></summary><p class="answer" data-i18n="faq.4.a"></p></details>
        <details><summary><span data-i18n="faq.5.q"></span><span class="plus"></span></summary><p class="answer" data-i18n="faq.5.a"></p></details>
      </div>
    </div>
  </section>

  <!-- CTA -->
  <section class="section dark cta">
    <div class="cta-orb" aria-hidden="true"><canvas data-orb="plain" data-count="700"></canvas></div>
    <div class="container reveal">
      <h2 class="h-xl" data-i18n-html="cta.title"></h2>
      <p class="lead" data-i18n="cta.lead"></p>
      <a class="btn btn--volt" href="join.html"><span data-i18n="cta.btn"></span><svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </div>
  </section>

</main>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
