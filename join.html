<!doctype html>
<html lang="hu" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Védőkör Szakszervezet</title>
  <meta name="description" content="Munkavállalói érdekképviselet több vállalatnál — jogsegély, bértárgyalás, támogatás.">
  <meta name="theme-color" content="#0b0a1a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="join" data-title-key="nav.join" class="page-light">
<main id="main">
  <section class="page-hero">
    <div class="blob" aria-hidden="true"></div>
    <div class="container">
      <span class="eyebrow fade-up" data-i18n="steps.eyebrow"></span>
      <h1 class="h-xl fade-up d2" style="margin-top:24px" data-i18n-html="join.page.title"></h1>
      <p class="lead muted fade-up d3" data-i18n="join.page.lead"></p>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="steps">
        <div class="step reveal"><h3 class="h-s" data-i18n="steps.1.t"></h3><p data-i18n="steps.1.d"></p></div>
        <div class="step reveal" style="--d:.1s"><h3 class="h-s" data-i18n="steps.2.t"></h3><p data-i18n="steps.2.d"></p></div>
        <div class="step reveal" style="--d:.2s"><h3 class="h-s" data-i18n="steps.3.t"></h3><p data-i18n="steps.3.d"></p></div>
      </div>
    </div>
  </section>

  <section class="section dark" id="form">
    <div class="container split">
      <div class="reveal" style="display:grid;gap:24px;align-content:start">
        <span class="eyebrow" data-i18n="why.eyebrow"></span>
        <h2 class="h-l" data-i18n-html="why.title"></h2>
        <ul class="checklist">
          <li data-i18n="why.1.t"></li><li data-i18n="why.2.t"></li><li data-i18n="why.3.t"></li><li data-i18n="why.4.t"></li><li data-i18n="why.5.t"></li>
        </ul>
      </div>
      <form class="form-card reveal" style="--d:.1s;color:var(--on-paper)" data-demo-form data-ok-key="join.form.ok" novalidate>
        <h3 class="h-m" data-i18n="join.form.t"></h3>
        <div class="field"><label for="j-name" data-i18n="join.form.name"></label><input class="input" id="j-name" name="name" autocomplete="name" required></div>
        <div class="field-row">
          <div class="field"><label for="j-email" data-i18n="join.form.email"></label><input class="input" id="j-email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="j-phone" data-i18n="join.form.phone"></label><input class="input" id="j-phone" name="phone" type="tel" autocomplete="tel"></div>
        </div>
        <div class="field"><label for="j-company" data-i18n="join.form.company"></label>
          <select class="input" id="j-company" name="company" required>
            <option value="" data-i18n="join.form.company.ph"></option>
            <option>Minta Pharma Zrt.</option><option>Minta Energia Kft.</option><option>Minta Vegyipari Nyrt.</option>
            <option value="other" data-i18n="join.form.company.other"></option>
          </select>
        </div>
        <div class="field"><label for="j-pos" data-i18n="join.form.position"></label><input class="input" id="j-pos" name="position" autocomplete="organization-title"></div>
        <label class="check"><input type="checkbox" required><span data-i18n="join.form.consent"></span></label>
        <div data-form-status hidden role="status"></div>
        <button class="btn btn--block" type="submit"><span data-i18n="join.form.submit"></span><svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <p class="form-note" data-i18n="join.form.demo"></p>
      </form>
    </div>
  </section>

  <section class="section">
    <div class="container faq-wrap">
      <div class="reveal" style="display:grid;gap:20px;align-content:start">
        <span class="eyebrow" data-i18n="faq.eyebrow"></span>
        <h2 class="h-l" data-i18n="faq.title"></h2>
      </div>
      <div class="faq reveal">
        <details open><summary><span data-i18n="faq.1.q"></span><span class="plus"></span></summary><p class="answer" data-i18n="faq.1.a"></p></details>
        <details><summary><span data-i18n="faq.2.q"></span><span class="plus"></span></summary><p class="answer" data-i18n="faq.2.a"></p></details>
        <details><summary><span data-i18n="faq.3.q"></span><span class="plus"></span></summary><p class="answer" data-i18n="faq.3.a"></p></details>
      </div>
    </div>
  </section>
</main>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
