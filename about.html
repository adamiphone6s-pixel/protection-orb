<!doctype html>
<html lang="hu" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Védőkör Szakszervezet</title>
  <meta name="description" content="Munkavállalói érdekképviselet több vállalatnál — jogsegély, bértárgyalás, támogatás.">
  <meta name="theme-color" content="#0b0a1a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="about" data-title-key="nav.about">
<main id="main">
  <section class="page-hero dark">
    <div class="blob" aria-hidden="true"></div>
    <div class="container">
      <span class="eyebrow fade-up" data-i18n="about.eyebrow"></span>
      <h1 class="h-xl fade-up d2" style="margin-top:24px" data-i18n-html="about.title"></h1>
      <p class="lead muted fade-up d3" data-i18n="about.lead"></p>
    </div>
  </section>

  <section class="section">
    <div class="container split">
      <div class="reveal" style="display:grid;gap:24px">
        <span class="eyebrow" data-i18n="about.mission.t"></span>
        <p class="h-m" data-i18n="about.mission.d"></p>
      </div>
      <div class="reveal" style="--d:.1s;display:grid;gap:24px">
        <span class="eyebrow" data-i18n="about.values.t"></span>
        <div class="values">
          <div class="value"><b data-i18n="about.v1.t"></b><span data-i18n="about.v1.d"></span></div>
          <div class="value"><b data-i18n="about.v2.t"></b><span data-i18n="about.v2.d"></span></div>
          <div class="value"><b data-i18n="about.v3.t"></b><span data-i18n="about.v3.d"></span></div>
          <div class="value"><b data-i18n="about.v4.t"></b><span data-i18n="about.v4.d"></span></div>
        </div>
      </div>
    </div>
  </section>

  <section class="section dark">
    <div class="container">
      <div class="section-head reveal"><span class="eyebrow" data-i18n="about.timeline.t"></span></div>
      <div class="timeline">
        <div class="tl-item reveal"><b data-i18n="about.t1.y"></b><span data-i18n="about.t1.d"></span></div>
        <div class="tl-item reveal" style="--d:.1s"><b data-i18n="about.t2.y"></b><span data-i18n="about.t2.d"></span></div>
        <div class="tl-item reveal" style="--d:.2s"><b data-i18n="about.t3.y"></b><span data-i18n="about.t3.d"></span></div>
        <div class="tl-item reveal" style="--d:.3s"><b data-i18n="about.t4.y"></b><span data-i18n="about.t4.d"></span></div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-head reveal"><span class="eyebrow" data-i18n="about.team.t"></span></div>
      <div class="team">
        <div class="person reveal"><div class="ph" style="background:var(--volt)">KJ</div><b>Kiss Judit</b><span data-i18n="about.team.r1"></span></div>
        <div class="person reveal" style="--d:.08s"><div class="ph" style="background:var(--violet);color:#fff">NG</div><b>Nagy Gábor</b><span data-i18n="about.team.r2"></span></div>
        <div class="person reveal" style="--d:.16s"><div class="ph" style="background:var(--coral)">NE</div><b>Dr. Nagy Eszter</b><span data-i18n="about.team.r3"></span></div>
        <div class="person reveal" style="--d:.24s"><div class="ph" style="background:var(--sky)">FR</div><b>Fekete Réka</b><span data-i18n="about.team.r4"></span></div>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="section-head reveal"><span class="eyebrow" data-i18n="about.companies.t"></span></div>
      <div class="logo-wall reveal">
        <div>Minta Pharma Zrt.</div><div>Minta Energia Kft.</div><div>Minta Vegyipari Nyrt.</div><div>Példa Gumigyár</div><div>Példa Logisztika</div><div>Példa Labor Kft.</div>
      </div>
    </div>
  </section>

  <section class="section dark cta">
    <div class="cta-orb" aria-hidden="true"><canvas data-orb="plain" data-count="700"></canvas></div>
    <div class="container reveal">
      <h2 class="h-xl" data-i18n-html="cta.title"></h2>
      <p class="lead" data-i18n="cta.lead"></p>
      <a class="btn btn--volt" href="join.html"><span data-i18n="cta.btn"></span><svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </div>
  </section>
</main>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
