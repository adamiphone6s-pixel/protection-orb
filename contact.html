<body data-page="contact" data-title-key="nav.contact" class="page-light">
<main id="main">
  <section class="page-hero">
    <div class="ph-orb" aria-hidden="true"><canvas data-gl-orb></canvas></div>
    <div class="container">
      <span class="eyebrow fade-up" data-i18n="nav.contact"></span>
      <h1 class="h-xl" data-split data-split-manual style="margin-top:24px" data-i18n="contact.page.title"></h1>
      <p class="lead muted fade-up d3" data-i18n="contact.page.lead"></p>
    </div>
  </section>
  <section class="section" style="padding-top:0">
    <div class="container split">
      <div class="reveal">
        <div class="contact-list">
          <div><small data-i18n="contact.office"></small><b data-i18n="contact.address"></b><span class="muted" data-i18n="contact.hours"></span></div>
          <div><small>E-mail</small><a href="mailto:info@vedokor.hu">info@vedokor.hu</a></div>
          <div><small data-i18n="contact.legal"></small><a href="tel:+3610000001">+36 1 000 0001</a></div>
        </div>
        <div class="map" aria-hidden="true">
          <svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice">
            <rect width="400" height="250" fill="#161619"/>
            <g stroke="#2b2856" stroke-width="10" fill="none" stroke-linecap="round">
              <path d="M-10 80 Q 120 60 200 120 T 420 150"/><path d="M60 -10 L 140 260"/><path d="M280 -10 Q 250 120 320 260"/><path d="M-10 200 L 420 190"/>
            </g>
            <path d="M-10 30 Q 100 50 180 20 T 420 60" stroke="#ff4a1c" stroke-opacity=".35" stroke-width="26" fill="none"/>
            <circle cx="205" cy="122" r="36" fill="#ff4a1c" opacity=".18"><animate attributeName="r" values="20;44;20" dur="3s" repeatCount="indefinite"/></circle>
            <circle cx="205" cy="122" r="10" fill="#ff4a1c"/>
          </svg>
        </div>
      </div>
      <form class="form-card reveal" style="--d:.1s" data-demo-form data-ok-key="contact.form.ok" novalidate>
        <h3 class="h-m" data-i18n="contact.form.t"></h3>
        <div class="field"><label for="c-name" data-i18n="join.form.name"></label><input class="input" id="c-name" autocomplete="name" required></div>
        <div class="field"><label for="c-email" data-i18n="join.form.email"></label><input class="input" id="c-email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="c-msg" data-i18n="contact.form.msg"></label><textarea class="input" id="c-msg" required></textarea></div>
        <label class="check"><input type="checkbox" required><span data-i18n="join.form.consent"></span></label>
        <div data-form-status hidden role="status"></div>
        <button class="btn btn--block" type="submit"><span data-i18n="contact.form.submit"></span><svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <p class="form-note" data-i18n="join.form.demo"></p>
      </form>
    </div>
  </section>
</main>

</body>
</html>
