      <span class="eyebrow fade-up" data-i18n="nav.contact"></span>

  <section class="section" style="padding-top:0">
    <div class="container split">
      <div class="reveal">
        <div class="contact-list">
          <div><small data-i18n="contact.phone"></small><a href="tel:+3615051678">06-1-505-1678</a></div>

      <form class="form-card reveal" style="--d:.1s" data-demo-form data-kind="contact" data-ok-key="contact.form.ok" novalidate>

        <div class="field"><label for="c-name" data-i18n="join.form.name"></label><input class="input" id="c-name" name="name" autocomplete="name" required maxlength="200"></div>

        <div class="field"><label for="c-msg" data-i18n="contact.form.msg"></label><textarea class="input" id="c-msg" name="message" required maxlength="5000"></textarea></div>
        <label class="check"><input type="checkbox" required><span data-i18n="join.form.consent"></span></label>

        <button class="btn btn--block" type="submit"><span data-i18n="contact.form.submit"></span><svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>

      </form>
    </div>
